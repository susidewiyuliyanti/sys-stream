name = "sys-streamer"
main = "index.ts"
compatibility_date = "2024-04-01"

[vars]
ENVIRONMENT = "production"
BASE_URL = "https://sysstreamer.asia"

[[d1_databases]]
binding = "DB"
database_name = "sys-streamer-db"
database_id = "b4500803-e9a8-46dc-9dc3-11a87c5fa365"

[durable_objects]
bindings = [
  { name = "ROOM_DURABLE_OBJECT", class_name = "RoomDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

# Production API routing: keep the React site on Pages while sending /api/*
# directly to this Worker. This removes the ambiguous Pages/Worker API split.
[[routes]]
pattern = "sysstreamer.asia/api/*"
zone_name = "sysstreamer.asia"

[[routes]]
pattern = "sysstreamer.asia/ws*"
zone_name = "sysstreamer.asia"
