      (function() {
        // Prevent browser wallet extension crashes (e.g. MetaMask, Coinbase, Rabby, Phantom)
        // when multiple extensions or iframes try to redefine window.ethereum
        try {
          var _ethereumVal = window.ethereum;
          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            get: function() { return _ethereumVal; },
            set: function(v) { _ethereumVal = v; }
          });
        } catch (_) {}

        try {
          var originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window && prop === 'ethereum') {
              try {
                return originalDefineProperty.call(Object, obj, prop, Object.assign({}, descriptor, {
                  configurable: true
                }));
              } catch (e) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    window.ethereum = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
            }
            return originalDefineProperty.call(Object, obj, prop, descriptor);
          };
        } catch (_) {}

        // Global capture of extension injection errors
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (typeof msg === 'string' && msg.toLowerCase().indexOf('ethereum') !== -1) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonMsg = (event && event.reason && (event.reason.message || event.reason)) || '';
          if (typeof reasonMsg === 'string' && reasonMsg.toLowerCase().indexOf('ethereum') !== -1) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
